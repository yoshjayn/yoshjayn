<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="112" viewBox="0 0 1200 112" role="img" aria-labelledby="title"><title id="title">Heart, Curiosity and Grit</title><rect width="1200" height="112" rx="18" fill="#181b28"/><g font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600"><circle cx="68" cy="56" r="9" fill="#ff9ebd"/><text x="92" y="63" fill="#ffbed3">Heart to understand.</text><circle cx="450" cy="56" r="9" fill="#8cd9f4"/><text x="474" y="63" fill="#b6eafa">Curiosity to explore.</text><circle cx="836" cy="56" r="9" fill="#a8e6a3"/><text x="860" y="63" fill="#c3efbf">Grit to keep building.</text></g></svg>
